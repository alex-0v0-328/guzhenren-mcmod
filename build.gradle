plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // Datagen cache files. Patterns are relative to each resource root, and the cache sits at the root
    // of src/generated/resources, so the template's "src/generated/**/.cache" never matched.
    exclude('.cache/**')
}

repositories {
    // Curios.
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Every test lives under src/test, one folder per layer, and none of them ships in the jar:
//   pure    L1 'pureTest': plain JVM, no Minecraft bootstrap -- enum ladders, math seams and
//           self-contained records. Anything touching Items.X / ModItems.X / ItemStack is L2.
//   modded  L2 'test': modded JUnit with registries loaded but no world.
//   game    L3 'gametest': @GameTest classes plus their scene templates, run by runGameTestServer
//           on a real dedicated server. The source set joins the mod below, so dev runs still find
//           the tests (and the /test command), while the jar task packs only 'main'.
sourceSets {
    test {
        java.srcDirs = ['src/test/modded/java']
        resources.srcDirs = ['src/test/modded/resources']
    }
    pureTest {
        java.srcDirs = ['src/test/pure/java']
        resources.srcDirs = ['src/test/pure/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gametest {
        java.srcDirs = ['src/test/game/java']
        resources.srcDirs = ['src/test/game/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // -PserverGameDir=<dir> swaps the game directory for a throwaway one: tools/check.py boots
        // its server smoke test there, so the pack mirror in run/mods (some of whose jars crash a
        // dedicated server) and the run/ world stay out. Without the property nothing changes.
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file(providers.gradleProperty('serverGameDir').getOrElse('run'))
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        // Its own game directory keeps the pack mirror in run/mods out: some of those jars crash a
        // dedicated server, while the mod under test and its compile-time dependencies (Epic Fight,
        // Curios) still load from the classpath.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // src/test is local-only (gitignored), so a CI checkout has no GameTests to join.
            if (file('src/test/game/java').isDirectory()) {
                sourceSet(sourceSets.gametest)
            }
        }
    }

    // Plain JUnit over the pure logic -- the derived formulas, the enum ladders and the GuSpec
    // self-check. Anything needing a live world belongs in a GameTest instead, not here.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly files('run/mods/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
    localRuntime files('run/mods/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
    testRuntimeOnly files('run/mods/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')

    compileOnly files('run/mods/geckolib-neoforge-1.21.1-4.9.2.jar')
    localRuntime files('run/mods/geckolib-neoforge-1.21.1-4.9.2.jar')
    testImplementation files('run/mods/geckolib-neoforge-1.21.1-4.9.2.jar')

    // Curios. The ':api' classifier ships only the public packages, so an internal API cannot be
    // reached by accident. The full jar has to stay on the runtime classpath: runData loads
    // CuriosDataProvider from it.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def junitGameDir = project.file('build/minecraft-junit')

neoForge.addModdingDependenciesTo sourceSets.pureTest

// GameTests compile against everything the mod compiles against and run with its runtime extras.
neoForge.addModdingDependenciesTo sourceSets.gametest
configurations {
    gametestCompileOnly.extendsFrom compileOnly
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom localRuntime, runtimeOnly
}

dependencies {
    pureTestImplementation platform("org.junit:junit-bom:${junit_version}")
    pureTestImplementation "org.junit.jupiter:junit-jupiter"
    pureTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('pureTest', Test) {
    description = 'Runs the pure JVM test source set without booting the modded runtime.'
    group = 'verification'
    workingDir junitGameDir
    testClassesDirs = sourceSets.pureTest.output.classesDirs
    classpath = sourceSets.pureTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
check.dependsOn pureTest

tasks.named('test', Test) {
    workingDir junitGameDir
    useJUnitPlatform()
    systemProperty 'gzr.projectDir', projectDir.absolutePath
    if (providers.gradleProperty('wikiDir').isPresent()) {
        def configuredWikiDir = providers.gradleProperty('wikiDir').get()
        // Set the raw value before the blank check: the wiki test skips on an unset property but
        // fails on a blank one, so an explicit -PwikiDir= must stay non-null.
        systemProperty 'gzr.wikiDir', configuredWikiDir
        if (!configuredWikiDir.isBlank()) {
            def wikiRoot = file(configuredWikiDir)
            systemProperty 'gzr.wikiDir', wikiRoot.absolutePath
            inputs.files([
                    '玩家向/蛊真人MOD 1.0.0 蛊材、蛊虫与炼蛊.md',
                    '玩家向/蛊真人MOD 1.0.0 角色.md',
                    '玩家向/蛊真人MOD 1.0.0 总表.md',
                    '开发向/工程/测试集.md'
            ].collect { new File(wikiRoot, it) })
            inputs.files(fileTree('src/test'))
        }
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
